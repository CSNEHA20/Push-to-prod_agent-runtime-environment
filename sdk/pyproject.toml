[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arc-sdk"
version = "0.1.0"
description = "Agent Runtime Core (ARC) Python SDK for Claude AI Agents"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "ARC Team"}
]
keywords = ["ai", "agents", "claude", "reliability", "tracing", "flight-recorder", "firewall", "recovery"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "anthropic>=0.19.0",
    "httpx>=0.27.0",
    "nest-asyncio>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]

[project.scripts]
arc = "arc.cli:main"

[project.urls]
Homepage = "https://github.com/Vishallakshmikanthan/agent-runtime-core"
Repository = "https://github.com/Vishallakshmikanthan/agent-runtime-core.git"
Documentation = "https://github.com/Vishallakshmikanthan/agent-runtime-core/blob/main/sdk/README.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["arc*", "arc_sdk*"]

[tool.semantic_release]
version_variable = ["arc/version.py:__version__"]
branch = "main"
upload_to_pypi = true
upload_to_release = true
build_command = "python -m build"
